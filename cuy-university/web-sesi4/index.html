<html>
    <head>
        <title>LAMP SESION</title>
    </head>
    <body>
        <img src ="aset/off.gif" alt = "" id="lamp1" />
        <h1>TURN ON/OFF LAMP</h1>
        <button onclick="saklar('on')"> Turn it On </button>
        <button onclick="saklar('off')"> Turn it Off </button>

        <script>
            function saklar(params) {

                let lamp1 = document.getElementById("lamp1");

                if (params == "on") {
                    lamp1.src = "aset/on.gif";
                } if (params == "off") {
                    lamp1.src = "aset/off.gif";
                }
                return lamp1;

            }
        </script>
    </body>
</html>
