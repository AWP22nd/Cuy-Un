<!doctype html>
<html lang="en">

    </head>

    <body>
        <div class="flex justify-center items-center min-h-screen w-full bg-gray-900 gap-10">

            <div class="flex flex-col gap-1">

                <button onclick="saklar('off', 1)" class="bg-white p-1 text-black"> Turn Lamp 1 Off </button>
            </div>

                <button onclick="saklar('off', 2)" class="bg-white p-1 text-black"> Turn Lamp 2 Off </button>
            </div>

                <!-- lamp 3 -->

                <img src ="aset/off.gif" alt = "" id="lamp3" />

                <button onclick="saklar('off', 3)" class="bg-white p-1 text-black"> Turn Lamp 3 Off </button>
