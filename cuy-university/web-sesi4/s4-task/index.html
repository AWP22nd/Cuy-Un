<!doctype html>
<html lang="en">
    <head>
        <title>CETRAK CETREK LAMPU JAVASCRIPT - CUYUNIVERSITY</title>

        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

        <style>
            @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

            body {
                font-family: 'Poppins', sans-serif;
                background: linear-gradient(135deg, #0f0c29, #302b63, #2c303a);
            }

            .lamp-on {
                filter: brightness(1.3) drop-shadow(0 0 20px #ffd700);
                transform: scale(1.05);
                transition: all 0.3s ease;
            }

            .lamp-off {
                filter: brightness(0.5);
                transform: scale(1);
                transition: all 0.3s ease;
            }

            .room-card {
                background: rgba(0, 0, 0, 0.05);
                backdrop-filter: blur(10px);
                border: 1px solid rgba(255, 255, 255, 0.1);
                border-radius: 20px;
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
                transition: transform 0.3s ease;
            }

            .room-card:hover {
                transform: translateY(-5px);
            }

            .toggle-switch {
                position: relative;
                width: 50px;
                height: 24px;
                background: #374151;
                border-radius: 12px;
                cursor: pointer;
                transition: background 0.3s ease;
            }

            .toggle-switch.active {
                background: linear-gradient(145deg, #ffd700, #ffaa00);
            }

            .toggle-switch::after {
                content: '';
                position: absolute;
                top: 2px;
                left: 2px;
                width: 20px;
                height: 20px;
                background: white;
                border-radius: 50%;
                transition: transform 0.3s ease;
            }

            .toggle-switch.active::after {
                transform: translateX(26px);
            }

            @keyframes glow {
                0%, 100% { box-shadow: 0 0 5px #ffd700; }
                50% { box-shadow: 0 0 20px #ffd700, 0 0 30px #ffaa00; }
            }

            .lamp-on img {
                animation: glow 2s infinite;
            }
        </style>
    </head>

    <body class="min-h-screen py-8 px-4">
        <div class="max-w-6xl mx-auto">
            <header class="text-center mb-12">
                <h1 class="text-4xl md:text-5xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 to-orange-500 mb-4 drop-shadow-lg">
                    💡 ON/OFF LAMP
                </h1>
                <p class="text-gray-400 text-lg">Kontrol lampu ruangan dengan mudah</p>
            </header>

            <!-- Ruangan Keluarga (3 LAMPU) -->
            <div class="room-card p-6 mb-8">

                    <h2 class="text-2xl font-bold text-red-400 flex items-center gap-2">
                        Ruangan Keluarga (Lampu)
                    </h2>
                    <button onclick="toggleGroup(1, true)" class="px-4 py-2 bg-red-500/20 hover:bg-red-500/40 text-red-300 rounded-lg transition">
                        🔆 Nyalakan Semua
                    </button>
                    <button onclick="toggleGroup(1, false)" class="px-4 py-2 bg-red-500/20 hover:bg-red-500/40 text-red-300 rounded-lg transition">
                        🌙 Matikan Semua
                    </button>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 justify-items-center">
                    <!-- Lamp 1 -->
                    <div class="lamp-control flex flex-col gap-3 justify-center items-center p-4 bg-gray-800/50 rounded-xl">

                        <span class="text-white font-medium">Lampu</span>
                        <div class="toggle-switch" id="switch1" onclick="toggleLamp(1)"></div>
                    </div>
                    <!-- Lamp 2 -->
                    <div class="lamp-control flex flex-col gap-3 justify-center items-center p-4 bg-gray-800/50 rounded-xl">

                        <span class="text-white font-medium">Lampu</span>
                        <div class="toggle-switch" id="switch2" onclick="toggleLamp(2)"></div>
                    </div>
                    <!-- Lamp 3 -->
                    <div class="lamp-control flex flex-col gap-3 justify-center items-center p-4 bg-gray-800/50 rounded-xl">
                        <img src="aset/off1.gif" alt="Lamp 3" id="lamp3" class="lamp-off w-28 h-28 cursor-pointer" onclick="toggleLamp(3)">
                        <span class="text-white font-medium">Lampu</span>
                        <div class="toggle-switch" id="switch3" onclick="toggleLamp(3)"></div>
                    </div>
                </div>
            </div>

            <!-- Ruangan Makan (1 LAMPU) -->

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 justify-items-center">

                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-3 justify-items-center">
