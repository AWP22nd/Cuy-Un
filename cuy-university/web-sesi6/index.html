<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="style.css" rel="stylesheet">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <nav>
            <a onclick="reRender()" id = "home">HOME</a>
            <a onclick="darkMode()" id="mode">DARK MODE</a>
        </nav>
        <h1>Welcome</h1>
        <p class= "info" id = "info"></p>
    </div>

    <script>
        let body = document.body;
        let info = document.getElementById("info");
        let mode = document.getElementById("mode");
        let home = document.getElementById("home");

        const darkLimit = 5;
        let darkCounter = 0;
        let darkRemainingLeft;

        function darkMode() {
            if (darkRemainingLeft == 0) {
                info.textContent = "You can`t use Dark Mode more than 5 times!"
                mode.style.display = "none";
                home.textContent = "RESTART";
                return;
            }



            darkCounter += 1;
            darkRemainingLeft = darkLimit - darkCounter;

            // Element
            info.textContent = `Dark Mode used:  ${darkCounter}x, left:  ${darkRemainingLeft}`

            body.classList.toggle("dark");
            
        }
            function reRender() {
            location.reload();
        }
    </script>

</body>
</html>
