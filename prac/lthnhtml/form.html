<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menggunakan Form</title>
</head>
<body>
    <form name="coba" action="#" method="post">
        <label for="xnama">Nama Mahasiswa :</label>
        <input type="text" name="xnama" id="xnama" size="30" maxlength="25" placeholder="Nama Mahasiswa"><br>
        <label for="xsex">Sex :</label>
        <select size="1" name="xsex" id="xsex">
            <option>Laki-laki</option>
            <option>Perempuan</option>
        </select><br>
        <input type="submit" value="Proses" name="xproses">
        <input type="reset" value="Reset" name="xreset">
    </form>
</body>
</html>
